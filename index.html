<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour — Bartender Cocktail Trainer</title>
    <link rel="stylesheet" href="app.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div id="app">
        <!-- Top Navigation / Menu Bar (Pinned to Top) -->
        <header class="app-header">
            <h1>Pour</h1>
            <nav class="nav-tabbar" id="nav-tabbar">
                <button class="nav-btn" data-target="drill">Drill</button>
                <button class="nav-btn active" data-target="library">Library</button>
                <button class="nav-btn" data-target="explore">Explore</button>
                <button class="nav-btn" data-target="play">Play</button>
                <button class="nav-btn" data-target="boss">Boss</button>
                <button class="nav-btn" data-target="cellar">Cellar</button>
            </nav>
        </header>

        <!-- Main Content Views -->
        <main class="app-content">
            <section id="view-drill" class="view-panel"></section>
            <section id="view-library" class="view-panel active"></section>
            <section id="view-explore" class="view-panel"></section>
            <section id="view-play" class="view-panel"></section>
            <section id="view-boss" class="view-panel"></section>
            <section id="view-cellar" class="view-panel"></section>
        </main>
    </div>

    <!-- Application Modules -->
    <script type="module" src="data.js"></script>
    <script type="module" src="cocktaildb.js"></script>
    <script type="module" src="game.js"></script>
    <script type="module" src="boss.js"></script>
    <script type="module" src="store.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
